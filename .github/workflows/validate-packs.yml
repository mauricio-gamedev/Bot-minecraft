name: Validate Bedrock Packs
on:
  push:
    branches: [main, "feature/**"]
    paths:
      - "packs/**"
      - "scripts/**"
      - ".github/workflows/validate-packs.yml"
  pull_request:
    paths:
      - "packs/**"
      - "scripts/**"
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pillow
      - run: python scripts/validate_packs.py
      - run: python scripts/package_mcaddon.py
      - uses: actions/upload-artifact@v4
        with:
          name: mc-companion-bedrock-addon
          path: dist/*.mcaddon
